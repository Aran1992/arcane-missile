<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>Shader 激光演示 - Arcane Missile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-x:hidden}

@media(max-width:680px){.card{width:95vw}}

<body>

<div id="webgl-status" class="webgl-status">检测中...</div>

<h1>⚡ Shader 激光光束 概念演示</h1>
<p class="sub">
  不依赖图片资源，纯 WebGL Fragment Shader / Canvas 2D 实时渲染<br>
  每个样式可直接嵌入 Pixi.js 作为 Shader Filter 或 粒子系统
</p>

<div class="demo-wrap" id="demo-wrap"></div>

<div class="controls">
  <label>脉冲速度 <input type="range" id="pulseRate" min="0" max="3" step=".1" value="1"></label>
  <label>亮度 <input type="range" id="brightness" min=".3" max="2" step=".1" value="1"></label>
  <label>厚度 <input type="range" id="thickness" min=".4" max="2" step=".1" value="1"></label>
  <button class="code-toggle" id="toggleCode">显示/隐藏 GLSL</button>
</div>

<script>
// ============================================================
//  Shader 定义：每种光束风格 = Fragment Shader + 元数据
//  注意：每个 Fragment Shader 首行必须声明精度（WebGL 约束）
// ============================================================

const BEAMS = [
  // ========== 1. Core-Glow 经典能量光束 ==========
  {
    id: 'coreglow',
    name: 'Core-Glow 经典能量束',
    tag: 'WebGL Shader',
    tagClass: 'webgl',
    desc: '多层发光叠加：白炽核心 → 彩色内辉光 → 半透明外辉光。适合作为精灵的 Shader Filter 直接应用到激光 Mesh 上。',
    glsl: [
      'precision highp float;',
      'uniform float uTime;',
      'uniform vec2 uRes;',
      'uniform float uPulse;',
      'uniform float uBright;',
      'uniform float uThick;',
      '',
      'mat2 rot(float a) {',
      '  float c = cos(a), s = sin(a);',
      '  return mat2(c, -s, s, c);',
      '}',
      '',
      'void main() {',
      '  vec2 uv = (gl_FragCoord.xy - uRes * 0.5) / uRes.y;',
      '  uv *= rot(0.0);',
      '  float along = uv.y + uTime * 0.8;',
      '  float dist = abs(uv.x);',
      '  float pulse = 0.85 + 0.15 * sin(uTime * 1.5 * uPulse);',
      '  float thick = 0.04 * uThick * pulse;',
      '  float core = exp(-dist * dist * 800.0 / (thick * thick));',
      '  float innerGlow = exp(-dist * dist * 150.0 / (thick * thick));',
      '  float outerGlow = exp(-dist * dist * 20.0 / (thick * thick));',
      '  float colorPhase = sin(along * 2.0) * 0.5 + 0.5;',
      '  vec3 col1 = vec3(0.3, 0.8, 1.0);',
      '  vec3 col2 = vec3(0.6, 0.2, 1.0);',
      '  vec3 innerColor = mix(col1, col2, colorPhase);',
      '  vec3 color = vec3(0.0);',
      '  color += outerGlow * innerColor * 0.15 * uBright;',
      '  color += innerGlow * innerColor * 0.6 * uBright;',
      '  color += core * vec3(1.0, 1.0, 1.0) * uBright;',
      '  float edgeNoise = sin(along * 30.0 + uTime * 2.0) * 0.003;',
      '  float glowEdge = smoothstep(thick + edgeNoise, thick + edgeNoise - 0.005, dist);',
      '  color += glowEdge * innerColor * 0.2 * uBright;',
      '  gl_FragColor = vec4(color, 1.0);',
      '}',
    ].join('\n'),
  },

  // ========== 2. 能量流动光束 ==========
  {
    id: 'energyflow',
    name: '能量流动光束',
    tag: 'WebGL Shader',
    tagClass: 'webgl',
    desc: '沿光束方向有流动的能量粒子，就像魔力在管道中奔腾。粒子密度和速度可控，颜色沿光束渐变。',
    glsl: [
      'precision highp float;',
      'uniform float uTime;',
      'uniform vec2 uRes;',
      'uniform float uPulse;',
      'uniform float uBright;',
      'uniform float uThick;',
      '',
      'float hash(vec2 p) {',
      '  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);',
      '}',
      '',
      'void main() {',
      '  vec2 uv = (gl_FragCoord.xy - uRes * 0.5) / uRes.y;',
      '  float along = uv.y * 2.0;',
      '  float dist = abs(uv.x);',
      '  float pulse = 0.9 + 0.1 * sin(uTime * 1.2 * uPulse);',
      '  float thick = 0.035 * uThick * pulse;',
      '  float core = exp(-dist * dist * 600.0 / (thick * thick));',
      '  float glow = exp(-dist * dist * 100.0 / (thick * thick));',
      '  float outer = exp(-dist * dist * 15.0 / (thick * thick));',
      '  float particles = 0.0;',
      '  for (int i = 0; i < 3; i++) {',
      '    float fi = float(i);',
      '    float speed = 1.0 + fi * 0.4;',
      '    float phase = along * 2.5 + uTime * speed * uPulse + fi * 1.7;',
      '    float cell = floor(phase);',
      '    float local = fract(phase) - 0.5;',
      '    float h = hash(vec2(cell, fi + 0.5));',
      '    float pSize = 0.08 + h * 0.12;',
      '    float pIntensity = smoothstep(pSize * thick, 0.0, abs(local));',
      '    float xOff = (h - 0.5) * thick * 1.2;',
      '    float xDist = abs(uv.x - xOff);',
      '    float xFade = exp(-xDist * xDist * 80.0 / (thick * thick));',
      '    particles += pIntensity * xFade * (0.5 + h * 0.5);',
      '  }',
      '  vec3 c1 = vec3(0.0, 0.9, 1.0);',
      '  vec3 c2 = vec3(1.0, 0.3, 0.6);',
      '  vec3 c3 = vec3(0.5, 0.2, 1.0);',
      '  float mixT = sin(along * 1.5 + uTime * 0.3) * 0.5 + 0.5;',
      '  vec3 beamColor = mix(mix(c1, c2, mixT), c3, sin(along * 0.8) * 0.5 + 0.5);',
      '  vec3 particleColor = vec3(0.8, 0.9, 1.0);',
      '  vec3 color = vec3(0.0);',
      '  color += outer * beamColor * 0.1 * uBright;',
      '  color += glow * beamColor * 0.5 * uBright;',
      '  color += core * vec3(1.0) * uBright;',
      '  color += particles * particleColor * (0.6 + 0.4 * sin(uTime * uPulse)) * uBright;',
      '  float sparkle = hash(vec2(floor(along * 80.0 + uTime * 5.0), 0.0));',
      '  sparkle = step(0.97, sparkle) * exp(-dist * dist * 400.0);',
      '  color += sparkle * vec3(1.0, 0.9, 0.8) * 0.5 * uBright;',
      '  gl_FragColor = vec4(color, 1.0);',
      '}',
    ].join('\n'),
  },

  // ========== 3. 等离子能量束 ==========
  {
    id: 'plasma',
    name: '等离子能量束',
    tag: 'WebGL Shader',
    tagClass: 'webgl',
    desc: '多频率噪声叠加产生的有机等离子效果。光束边缘有"滋滋"的能量扰动，适合魔法/奥术类技能。',
    glsl: [
      'precision highp float;',
      'uniform float uTime;',
      'uniform vec2 uRes;',
      'uniform float uPulse;',
      'uniform float uBright;',
      'uniform float uThick;',
      '',
      'float hash(vec3 p) {',
      '  p = fract(p * 0.3183099 + 0.1);',
      '  p *= 17.0;',
      '  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));',
      '}',
      '',
      'float noise_(vec3 p) {',
      '  vec3 i = floor(p);',
      '  vec3 f = fract(p);',
      '  f = f * f * (3.0 - 2.0 * f);',
      '  float a = hash(i);',
      '  float b = hash(i + vec3(1.0, 0.0, 0.0));',
      '  float c = hash(i + vec3(0.0, 1.0, 0.0));',
      '  float d = hash(i + vec3(1.0, 1.0, 0.0));',
      '  float ee = hash(i + vec3(0.0, 0.0, 1.0));',
      '  float ff = hash(i + vec3(1.0, 0.0, 1.0));',
      '  float g = hash(i + vec3(0.0, 1.0, 1.0));',
      '  float h = hash(i + vec3(1.0, 1.0, 1.0));',
      '  float ux = mix(mix(a, b, f.x), mix(c, d, f.x), f.y);',
      '  float uy = mix(mix(ee, ff, f.x), mix(g, h, f.x), f.y);',
      '  return mix(ux, uy, f.z);',
      '}',
      '',
      'float fbm(vec3 p) {',
      '  float v = 0.0, a = 0.5;',
      '  for (int i = 0; i < 4; i++) {',
      '    v += a * noise_(p);',
      '    p *= 2.0;',
      '    a *= 0.5;',
      '  }',
      '  return v;',
      '}',
      '',
      'void main() {',
      '  vec2 uv = (gl_FragCoord.xy - uRes * 0.5) / uRes.y;',
      '  float along = uv.y * 3.0;',
      '  float dist = abs(uv.x);',
      '  float pulse = 0.85 + 0.15 * sin(uTime * 0.8 * uPulse);',
      '  float thick = 0.04 * uThick * pulse;',
      '  vec3 np = vec3(uv.x * 4.0, uv.y * 2.0 + uTime * 0.15, uTime * 0.2);',
      '  float plasma = fbm(np);',
      '  vec3 np2 = vec3(uv.y * 3.0 + uTime * 0.3, uTime * 0.1, uv.x * 5.0);',
      '  float boundaryNoise = (fbm(np2) - 0.5) * 0.01;',
      '  float d = dist + boundaryNoise;',
      '  float core = exp(-d * d * 500.0 / (thick * thick));',
      '  float glow = exp(-d * d * 80.0 / (thick * thick));',
      '  float outer = exp(-d * d * 12.0 / (thick * thick));',
      '  vec3 hot = mix(vec3(0.2, 0.0, 0.6), vec3(1.0, 0.2, 0.4), plasma);',
      '  hot = mix(hot, vec3(1.0, 0.8, 0.3), smoothstep(0.4, 1.0, plasma));',
      '  vec3 color = vec3(0.0);',
      '  color += outer * hot * 0.08 * uBright;',
      '  color += glow * hot * 0.5 * uBright;',
      '  color += core * vec3(1.0, 0.9, 0.8) * uBright;',
      '  float discharge = step(0.92, fbm(vec3(uv.x * 30.0, uv.y * 20.0 + uTime * 3.0, uTime * 0.5)));',
      '  discharge *= smoothstep(thick * 1.5, thick * 0.2, dist);',
      '  color += discharge * vec3(1.0, 0.6, 0.2) * 0.3 * uBright;',
      '  gl_FragColor = vec4(color, 1.0);',
      '}',
    ].join('\n'),
  },

  // ========== 4. 闪电弧 ==========
  {
    id: 'lightning',
    name: '闪电弧光束',
    tag: 'WebGL Shader',
    tagClass: 'webgl',
    desc: '程序化生成的闪电分支。锯齿形主弧 + 随机分支 + 辉光。频率、分支数量、弧的曲折度可调。',
    glsl: [
      'precision highp float;',
      'uniform float uTime;',
      'uniform vec2 uRes;',
      'uniform float uPulse;',
      'uniform float uBright;',
      'uniform float uThick;',
      '',
      'float hash21(vec2 p) {',
      '  p = fract(p * vec2(234.34, 435.345));',
      '  p += dot(p, p + 19.19);',
      '  return fract(p.x * p.y);',
      '}',
      '',
      'void main() {',
      '  vec2 uv = (gl_FragCoord.xy - uRes * 0.5) / uRes.y;',
      '  float along = uv.y * 2.0 + 1.0;',
      '  float widthOffset = uv.x;',
      '  float seed = uTime * 0.5;',
      '  float total = 0.0;',
      '  float thickBase = 0.003 * uThick;',
      '',
      '  for (int j = 0; j < 3; j++) {',
      '    float fj = float(j);',
      '    float detail = 0.08 + fj * 0.02;',
      '    vec2 p = vec2(widthOffset * 2.0 + fj * 0.3, along);',
      '    float best = 1.0;',
      '    for (int i = 0; i < 12; i++) {',
      '      float fi = float(i);',
      '      float t1 = fi / 12.0;',
      '      float t2 = (fi + 1.0) / 12.0;',
      '      float h1 = hash21(vec2(fi, seed + fj * 7.7)) - 0.5;',
      '      float h2 = hash21(vec2(fi + 1.0, seed + fj * 7.7)) - 0.5;',
      '      float h3 = hash21(vec2(fi + 0.5, seed + fj * 7.7));',
      '      float x1 = h1 * detail;',
      '      float x2 = h2 * detail;',
      '      float y1 = t1;',
      '      float y2 = t2;',
      '      float midX = (x1 + x2) * 0.5 + (h3 - 0.5) * detail * 0.5;',
      '      float midY = (y1 + y2) * 0.5;',
      '      float segD = 1000000.0;',
      '      {',
      '        vec2 a = vec2(x1, y1);',
      '        vec2 b = vec2(midX, midY);',
      '        vec2 v = b - a;',
      '        vec2 w = p - a;',
      '        float t = clamp(dot(w, v) / dot(v, v), 0.0, 1.0);',
      '        segD = min(segD, length(w - t * v));',
      '      }',
      '      {',
      '        vec2 a = vec2(midX, midY);',
      '        vec2 b = vec2(x2, y2);',
      '        vec2 v = b - a;',
      '        vec2 w = p - a;',
      '        float t = clamp(dot(w, v) / dot(v, v), 0.0, 1.0);',
      '        segD = min(segD, length(w - t * v));',
      '      }',
      '      float flash = step(0.92, hash21(vec2(fi, seed + fj * 7.7 + uTime * 3.0))) * 0.3 + 0.7;',
      '      segD /= flash;',
      '      best = min(best, segD);',
      '    }',
      '    float arc = exp(-best * best * 20.0 / (thickBase * thickBase));',
      '    float glow = exp(-best * best * 2.0 / (thickBase * thickBase));',
      '    total += arc * 0.8 + glow * 0.2;',
      '  }',
      '',
      '  float pulse = 0.7 + 0.3 * sin(uTime * 4.0 * uPulse) * sin(uTime * 7.0 * uPulse);',
      '  total *= clamp(pulse + 0.3, 0.0, 2.0);',
      '  vec3 color = total * vec3(0.5, 0.7, 1.0) * uBright;',
      '  float brightCore = step(0.85, total);',
      '  color += brightCore * vec3(1.0, 0.95, 0.9) * 0.5 * uBright;',
      '  gl_FragColor = vec4(color, 1.0);',
      '}',
    ].join('\n'),
  },

  // ========== 5. 硬光网格（科幻护盾光束） ==========
  {
    id: 'hardlight',
    name: '硬光网格 Sci-Fi 光束',
    tag: 'WebGL Shader',
    tagClass: 'webgl',
    desc: '硬表面风格的激光——内部有网格纹理，边缘锐利带扫描线。适合科技/赛博风。',
    glsl: [
      'precision highp float;',
      'uniform float uTime;',
      'uniform vec2 uRes;',
      'uniform float uPulse;',
      'uniform float uBright;',
      'uniform float uThick;',
      '',
      'void main() {',
      '  vec2 uv = (gl_FragCoord.xy - uRes * 0.5) / uRes.y;',
      '  float along = uv.y * 3.0;',
      '  float dist = abs(uv.x);',
      '  float pulse = 0.9 + 0.1 * sin(uTime * uPulse);',
      '  float thick = 0.035 * uThick * pulse;',
      '  float beam = smoothstep(thick * 1.2, thick * 0.3, dist);',
      '  vec2 gridUV = vec2(uv.x * 3.0, along * 2.0);',
      '  vec2 grid = abs(fract(gridUV) - 0.5);',
      '  float gridLine = min(grid.x, grid.y);',
      '  float gridPattern = 1.0 - smoothstep(0.0, 0.06, gridLine);',
      '  float scanLine = step(0.94, fract(along * 6.0 + uTime * 0.5));',
      '  float rings = sin(along * 8.0 - uTime * 1.5 * uPulse) * 0.5 + 0.5;',
      '  rings = step(0.7, rings);',
      '  vec3 baseColor = vec3(0.0, 0.8, 1.0);',
      '  vec3 gridColor = vec3(0.4, 0.9, 1.0);',
      '  vec3 color = vec3(0.0);',
      '  color += beam * baseColor * 0.3 * uBright;',
      '  color += beam * gridPattern * gridColor * 0.7 * uBright;',
      '  color += beam * scanLine * vec3(1.0, 0.9, 0.7) * 0.6 * uBright;',
      '  color += beam * rings * baseColor * 0.4 * uBright;',
      '  float core = smoothstep(thick * 0.2, 0.0, dist);',
      '  color += core * vec3(1.0, 0.95, 0.9) * 0.4 * uBright;',
      '  gl_FragColor = vec4(color, 1.0);',
      '}',
    ].join('\n'),
  },
];

// ============================================================
//  Canvas 2D 备用渲染
// ============================================================

function renderParticleBeam(ctx2d, w, h, time, params) {
  const cx = w / 2;
  const {pulse, bright, thick} = params;

  ctx2d.clearRect(0, 0, w, h);

  // 光束主体
  for (let layer = 0; layer < 3; layer++) {
    const t = thick * (0.04 + layer * 0.025) * (0.9 + 0.1 * Math.sin(time * 1.5 * pulse));
    const alpha = [0.15, 0.35, 0.6][layer];
    const grad = ctx2d.createLinearGradient(cx - t * w, 0, cx + t * w, 0);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.3, 'rgba(100,200,255,' + (alpha * bright) + ')');
    grad.addColorStop(0.5, 'rgba(255,255,255,' + ((alpha + 0.2) * bright) + ')');
    grad.addColorStop(0.7, 'rgba(100,200,255,' + (alpha * bright) + ')');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx2d.fillStyle = grad;
    ctx2d.fillRect(0, 0, w, h);
  }

  // 流动粒子
  for (let i = 0; i < 30; i++) {
    const seed = i * 137.5;
    const along = ((seed * 0.01 + time * (0.5 + (seed % 3) * 0.2) * pulse) % 2 - 1) * 0.45;
    const xOff = (Math.sin(seed * 2.3) * 0.5) * thick * 0.03;
    const px = cx + xOff * w;
    const py = h * (0.5 + along);
    const size = 1.5 + (Math.sin(seed * 4.1) * 0.5 + 0.5) * 3;
    const alpha = 0.3 + 0.7 * (1 - Math.abs(along) * 2);
    ctx2d.beginPath();
    ctx2d.arc(px, py, size, 0, Math.PI * 2);
    ctx2d.fillStyle = 'rgba(180,230,255,' + (alpha * bright) + ')';
    ctx2d.fill();
  }
}

// ============================================================
//  页面构建
// ============================================================

const demoWrap = document.getElementById('demo-wrap');

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

BEAMS.forEach((beam, idx) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = [
    '<div class="card-header">',
    '  <h2>' + beam.name + '</h2>',
    '  <span class="tag tag-' + beam.tagClass + '">' + beam.tag + '</span>',
    '</div>',
    '<canvas id="canvas-shader-' + idx + '" width="640" height="280"></canvas>',
    '<div class="shader-error" id="shader-error-' + idx + '"></div>',
    '<div class="desc">' + beam.desc + '</div>',
    '<pre class="shader-code" id="code-' + idx + '">' + escapeHtml(beam.glsl) + '</pre>',
  ].join('\n');
  demoWrap.appendChild(card);
});

// Canvas 2D 卡片
const gfxCard = document.createElement('div');
gfxCard.className = 'card';
gfxCard.innerHTML = [
  '<div class="card-header">',
  '  <h2>粒子尾迹光束（Canvas 2D · 无需 Shader）</h2>',
  '  <span class="tag tag-gfx">Canvas 2D</span>',
  '</div>',
  '<canvas id="canvas-gfx" width="640" height="280"></canvas>',
  '<div class="desc">',
  '  <strong>纯 Graphics API 实现</strong> —— 不依赖 WebGL/Shader，兼容性最好。<br>',
  '  使用多层线性渐变模拟辉光 + 粒子系统实现能量流动效果。<br>',
  '  在 Pixi.js 中直接用 <code>Graphics</code> 渐变填充 + <code>Container</code> 粒子精灵即可复现。',
  '</div>',
  '<pre class="shader-code" style="color:#aaa;font-family:inherit;background:#0a0a15">',
  '// 纯 Canvas 2D / Pixi.js Graphics 实现思路：',
  '// 1. 多层线性渐变（从透明→颜色→白色→颜色→透明）绘制光束主体',
  '// 2. 粒子数组：每个粒子有沿光束的位置、横向偏移、大小、透明度',
  '// 3. 每帧更新粒子位置（沿光束流动），循环使用',
  '// 4. 粒子的 Alpha = f(距中心距离) × f(距发射端距离)',
  '// 优点：零 Shader 依赖，低性能开销，容易控制',
  '</pre>',
].join('\n');
demoWrap.appendChild(gfxCard);

// ============================================================
//  WebGL 渲染器（改进版：try WebGL2 → WebGL1，显示编译错误）
// ============================================================

const VSHADER = [
  'attribute vec2 aPos;',
  'void main() {',
  '  gl_Position = vec4(aPos, 0.0, 1.0);',
  '}',
].join('\n');

function createShader(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    gl.deleteShader(s);
    return { error: log };
  }
  return { shader: s };
}

function createProgram(gl, vsSrc, fsSrc) {
  const vs = createShader(gl, gl.VERTEX_SHADER, vsSrc);
  if (vs.error) return { error: 'Vertex shader: ' + vs.error };
  const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSrc);
  if (fs.error) return { error: 'Fragment shader: ' + fs.error };
  const prog = gl.createProgram();
  gl.attachShader(prog, vs.shader);
  gl.attachShader(prog, fs.shader);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(prog);
    gl.deleteProgram(prog);
    return { error: 'Link: ' + log };
  }
  return { program: prog, vs: vs.shader, fs: fs.shader };
}

function initWebGL(canvas, fragSrc) {
  // Try WebGL2 first, then WebGL1
  let gl = canvas.getContext('webgl2', { alpha: false, antialias: false });
  if (!gl) gl = canvas.getContext('webgl', { alpha: false, antialias: false });
  if (!gl) return { error: 'WebGL not available' };

  const result = createProgram(gl, VSHADER, fragSrc);
  if (result.error) return { error: result.error };

  const prog = result.program;
  gl.useProgram(prog);

  // Full-screen quad (2 triangles)
  const verts = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);

  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const uTime = gl.getUniformLocation(prog, 'uTime');
  const uRes = gl.getUniformLocation(prog, 'uRes');
  const uPulse = gl.getUniformLocation(prog, 'uPulse');
  const uBright = gl.getUniformLocation(prog, 'uBright');
  const uThick = gl.getUniformLocation(prog, 'uThick');

  return { gl, prog, uTime, uRes, uPulse, uBright, uThick };
}

// ============================================================
//  启动
// ============================================================

const params = {
  pulse: 1,
  bright: 1,
  thick: 1,
};

const pulseSlider = document.getElementById('pulseRate');
const brightSlider = document.getElementById('brightness');
const thickSlider = document.getElementById('thickness');
pulseSlider.addEventListener('input', function() { params.pulse = parseFloat(this.value); });
brightSlider.addEventListener('input', function() { params.bright = parseFloat(this.value); });
thickSlider.addEventListener('input', function() { params.thick = parseFloat(this.value); });

document.getElementById('toggleCode').addEventListener('click', function() {
  const codes = document.querySelectorAll('.shader-code');
  var vis = codes[0].style.display !== 'none';
  for (var i = 0; i < codes.length; i++) {
    codes[i].style.display = vis ? 'none' : 'block';
  }
});

// 初始化所有 WebGL 渲染器
var renderers = [];
var webglWorking = false;

for (var idx = 0; idx < BEAMS.length; idx++) {
  var beam = BEAMS[idx];
  var canvas = document.getElementById('canvas-shader-' + idx);
  var errorDiv = document.getElementById('shader-error-' + idx);
  var result = initWebGL(canvas, beam.glsl);

  if (result.error) {
    // Show error on canvas via 2D
    errorDiv.style.display = 'block';
    errorDiv.textContent = '❌ ' + result.error;

    var ctx = canvas.getContext('2d');
    if (ctx) {
      ctx.fillStyle = '#0a0a15';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#e74c3c';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚠ ' + result.error.substring(0, 60), canvas.width / 2, canvas.height / 2 - 10);
      ctx.fillStyle = '#a00';
      ctx.font = '11px sans-serif';
      ctx.fillText('(检查控制台或错误栏以查看详情)', canvas.width / 2, canvas.height / 2 + 16);
    }
  } else {
    webglWorking = true;
    renderers.push({
      idx: idx,
      canvas: canvas,
      gl: result.gl,
      prog: result.prog,
      uTime: result.uTime,
      uRes: result.uRes,
      uPulse: result.uPulse,
      uBright: result.uBright,
      uThick: result.uThick,
    });
  }
}

// WebGL status indicator
var statusEl = document.getElementById('webgl-status');
statusEl.textContent = webglWorking
  ? '✅ WebGL ' + (document.createElement('canvas').getContext('webgl2') ? '2.0' : '1.0')
  : '❌ WebGL 不可用（降级到 Canvas 2D）';
statusEl.className = 'webgl-status ' + (webglWorking ? 'webgl-ok' : 'webgl-fail');

// GFX canvas
var gfxCanvas = document.getElementById('canvas-gfx');
var gfxCtx = gfxCanvas.getContext('2d');

// 渲染循环
var startTime = performance.now();

function render() {
  var now = performance.now();
  var time = (now - startTime) / 1000;

  for (var rIdx = 0; rIdx < renderers.length; rIdx++) {
    var r = renderers[rIdx];
    var gl = r.gl;
    gl.viewport(0, 0, r.canvas.width, r.canvas.height);
    gl.uniform1f(r.uTime, time);
    gl.uniform2f(r.uRes, r.canvas.width, r.canvas.height);
    gl.uniform1f(r.uPulse, params.pulse);
    gl.uniform1f(r.uBright, params.bright);
    gl.uniform1f(r.uThick, params.thick);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  // GFX
  renderParticleBeam(gfxCtx, gfxCanvas.width, gfxCanvas.height, time, params);

  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
